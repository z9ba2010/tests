name: QA Automation Pipeline

on:
  # Daily scheduled run (nightly regressions at 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        required: true
        type: choice
        options:
          - all
          - api
          - e2e
        default: 'api'
      target_app:
        description: 'Target Mobile Application (for e2e suite)'
        required: false
        type: choice
        options:
          - wardrobe
          - maxfunfit
          - matreshka
        default: 'wardrobe'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

permissions:
  contents: read
  actions: read

jobs:
  api-tests:
    name: Backend API Integration Tests
    if: "${{ github.event_name == 'schedule' || inputs.test_suite == 'api' || inputs.test_suite == 'all' }}"
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.environment || 'staging' }}
      PARSER_API_BASE_URL: ${{ secrets.PARSER_API_BASE_URL || 'https://api.staging.internal/parser' }}
      API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN || 'mock-secret-token' }}

    steps:
      - name: Checkout QA Hub repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API Tests with pytest
        run: |
          pytest tests/api \
            --env="${{ env.TEST_ENV }}" \
            --html=reports/api_test_report.html \
            --self-contained-html \
            -v

      - name: Upload API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ env.TEST_ENV }}
          path: reports/api_test_report.html
          retention-days: 14

  e2e-mobile-tests:
    name: Mobile E2E Tests (Appium / Android)
    if: "${{ github.event_name == 'schedule' || inputs.test_suite == 'e2e' || inputs.test_suite == 'all' }}"
    runs-on: macos-latest
    env:
      TEST_ENV: ${{ inputs.environment || 'staging' }}
      TARGET_APP: ${{ inputs.target_app || 'wardrobe' }}
      APPIUM_SERVER_URL: 'http://127.0.0.1:4723'

    steps:
      - name: Checkout QA Hub repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js & Appium 2.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server in Background
        run: |
          appium --log-timestamp --log reports/appium.log &
          sleep 5

      - name: Setup Android SDK & Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p reports
            pytest tests/e2e \
              --app="${{ env.TARGET_APP }}" \
              --env="${{ env.TEST_ENV }}" \
              --html=reports/e2e_test_report.html \
              --self-contained-html \
              -v

      - name: Upload E2E Test Report & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-report-${{ env.TARGET_APP }}
          path: |
            reports/e2e_test_report.html
            reports/appium.log
          retention-days: 14
